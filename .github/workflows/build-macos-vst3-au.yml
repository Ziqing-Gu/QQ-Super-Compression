name: Build macOS VST3 and AU 1.3.2

on:
  workflow_dispatch:
    inputs:
      vst3_only:
        description: Reuse an already verified AU with identical production inputs
        type: boolean
        default: false
      vst3_arch:
        description: VST3 architecture to build
        type: choice
        options: [all, arm64, x86_64]
        default: all

permissions:
  contents: read

jobs:
  build-vst3:
    name: VST3 ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.vst3_arch == 'arm64' && '[{"name":"Apple Silicon (arm64)","runner":"macos-14","expected_arch":"arm64","artifact_name":"QQ-Super-Compression-1.3.2-macOS-Apple-Silicon-VST3"}]' || inputs.vst3_arch == 'x86_64' && '[{"name":"Intel (x86_64)","runner":"macos-15-intel","expected_arch":"x86_64","artifact_name":"QQ-Super-Compression-1.3.2-macOS-Intel-VST3"}]' || '[{"name":"Apple Silicon (arm64)","runner":"macos-14","expected_arch":"arm64","artifact_name":"QQ-Super-Compression-1.3.2-macOS-Apple-Silicon-VST3"},{"name":"Intel (x86_64)","runner":"macos-15-intel","expected_arch":"x86_64","artifact_name":"QQ-Super-Compression-1.3.2-macOS-Intel-VST3"}]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S .
          -B build-macos
          -DQQSC_FETCH_JUCE=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.expected_arch }}
          -DQQSC_BUILD_DYNAMICS_CHECK=ON
          -DQQSC_BUILD_VISUAL_CHECK=ON

      - name: Build VST3 and 1.3.2 release checks
        run: cmake --build build-macos --target QQSuperCompression_VST3 QQSCLimiterCheck QQSCReviewCheck QQSCVisualCheck --config Release --parallel 3

      - name: Verify current SAFE, window, oversampling, Display and transport contracts
        shell: bash
        run: |
          set -euo pipefail
          check_root="$RUNNER_TEMP/qqsc-1.3.2-checks"
          for profile in distort lookahead-presets overall-os; do
            build-macos/QQSCLimiterCheck_artefacts/Release/QQSCLimiterCheck "$check_root/$profile" "$profile"
          done
          build-macos/QQSCVisualCheck_artefacts/Release/QQSCVisualCheck "$check_root/display" --detector-zero-display
          build-macos/QQSCReviewCheck_artefacts/Release/QQSCReviewCheck "$check_root/transport" --transport-1241
          build-macos/QQSCReviewCheck_artefacts/Release/QQSCReviewCheck "$check_root/full-idle" --full-idle-1242

      - name: Verify architecture and package VST3
        shell: bash
        run: |
          vst3='build-macos/QQSuperCompression_artefacts/Release/VST3/QQ Super Compression.vst3'
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict --verbose=2 "$vst3"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$vst3/Contents/Info.plist")" = "1.3.2"
          vst3_binary=$(find "$vst3/Contents/MacOS" -type f -print -quit)
          test -n "$vst3_binary"
          lipo -archs "$vst3_binary" | tr ' ' '\n' | grep -Fx '${{ matrix.expected_arch }}'
          ditto -c -k --keepParent "$vst3" '${{ matrix.artifact_name }}.zip'

      - name: Upload packaged VST3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7

  build-au:
    if: ${{ !inputs.vst3_only }}
    name: AU Universal 2 (arm64 + x86_64)
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Universal 2
        run: >
          cmake -S .
          -B build-macos-au
          -DQQSC_FETCH_JUCE=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'

      - name: Build Universal 2 AU
        run: cmake --build build-macos-au --target QQSuperCompression_AU --config Release --parallel 3

      - name: Validate AU for Logic
        shell: bash
        run: |
          au='build-macos-au/QQSuperCompression_artefacts/Release/AU/QQ Super Compression.component'
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$au/Contents/Info.plist")" = "1.3.2"
          codesign --force --deep --sign - "$au"
          codesign --verify --deep --strict --verbose=2 "$au"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$au" "$HOME/Library/Audio/Plug-Ins/Components/QQ Super Compression.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Qscp Qing

      - name: Verify both architectures and package AU
        shell: bash
        run: |
          au='build-macos-au/QQSuperCompression_artefacts/Release/AU/QQ Super Compression.component'
          au_binary=$(find "$au/Contents/MacOS" -type f -print -quit)
          test -n "$au_binary"
          archs=$(lipo -archs "$au_binary")
          printf '%s\n' "$archs"
          printf '%s\n' "$archs" | tr ' ' '\n' | grep -Fx arm64
          printf '%s\n' "$archs" | tr ' ' '\n' | grep -Fx x86_64
          ditto -c -k --keepParent "$au" 'QQ-Super-Compression-1.3.2-macOS-Universal-AU.zip'

      - name: Upload packaged AU
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Super-Compression-1.3.2-macOS-Universal-AU
          path: QQ-Super-Compression-1.3.2-macOS-Universal-AU.zip
          if-no-files-found: error
          retention-days: 7
