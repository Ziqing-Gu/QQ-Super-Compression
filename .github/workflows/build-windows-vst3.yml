name: Build Windows VST3 1.1.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vst3:
    name: QQ Super Compression VST3 Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >
          cmake -S .
          -B build-windows
          -G "Visual Studio 17 2022"
          -A x64
          -DQQSC_FETCH_JUCE=ON

      - name: Build VST3
        shell: pwsh
        run: cmake --build build-windows --target QQSuperCompression_VST3 --config Release --parallel 3

      - name: Verify and package VST3
        shell: pwsh
        run: |
          $vst3 = "build-windows/QQSuperCompression_artefacts/Release/VST3/QQ Super Compression.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "Missing VST3 bundle: $vst3" }
          Compress-Archive -LiteralPath $vst3 -DestinationPath "QQ-Super-Compression-1.1.5-Windows-x64.zip"

      - name: Upload packaged VST3
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Super-Compression-1.1.5-Windows-x64
          path: QQ-Super-Compression-1.1.5-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
