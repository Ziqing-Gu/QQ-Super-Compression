name: Build Windows VST3 1.3.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vst3:
    name: QQ Super Compression VST3 Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S .
          -B build-windows
          -G "Visual Studio 17 2022"
          -A x64
          -DQQSC_FETCH_JUCE=ON
          -DQQSC_BUILD_DYNAMICS_CHECK=ON
          -DQQSC_BUILD_VISUAL_CHECK=ON

      - name: Build VST3
        shell: pwsh
        run: cmake --build build-windows --target QQSuperCompression_VST3 QQSCReviewCheck QQSCLimiterCheck QQSCVisualCheck --config Release --parallel 3

      - name: Verify current release checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkRoot = Join-Path $env:RUNNER_TEMP 'qqsc-1.3.4-checks'
          foreach ($profile in @('limiter-45','shared-controls','cumulative-match','window-link','lookahead-presets','overall-os')) {
            & 'build-windows/QQSCLimiterCheck_artefacts/Release/QQSCLimiterCheck.exe' "$checkRoot/$profile" $profile
            if ($LASTEXITCODE -ne 0) { throw "Limiter checks failed: $profile" }
          }
          & 'build-windows/QQSCVisualCheck_artefacts/Release/QQSCVisualCheck.exe' "$checkRoot/display" --detector-zero-display
          if ($LASTEXITCODE -ne 0) { throw 'Display checks failed' }
          foreach ($profile in @('--transport-1241','--full-idle-1242')) {
            & 'build-windows/QQSCReviewCheck_artefacts/Release/QQSCReviewCheck.exe' "$checkRoot/$profile" $profile
            if ($LASTEXITCODE -ne 0) { throw "Transport checks failed: $profile" }
          }

      - name: Verify and package VST3
        shell: pwsh
        run: |
          $vst3 = "build-windows/QQSuperCompression_artefacts/Release/VST3/QQ Super Compression.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "Missing VST3 bundle: $vst3" }
          $module = Get-Content -LiteralPath "$vst3/Contents/Resources/moduleinfo.json" -Raw | ConvertFrom-Json
          if ($module.Version -ne '1.3.4') { throw 'Wrong VST3 version' }
          Compress-Archive -LiteralPath $vst3 -DestinationPath "QQ-Super-Compression-1.3.4-Windows-x64.zip"

      - name: Upload packaged VST3
        uses: actions/upload-artifact@v4
        with:
          name: QQ-Super-Compression-1.3.4-Windows-x64
          path: QQ-Super-Compression-1.3.4-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
